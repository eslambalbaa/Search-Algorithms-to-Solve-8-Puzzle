<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrick's 8-Puzzle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="sky" aria-hidden="true"></div>
    <div class="tint" aria-hidden="true"></div>
    <canvas id="vortex" aria-hidden="true"></canvas>
    <div class="bubbles" id="bubbles" aria-hidden="true"></div>
    <canvas id="confetti" aria-hidden="true"></canvas>

    <main>
        <h1>Patrick's 8-Puzzle</h1>

        <section class="controls" aria-label="Puzzle settings">
            <div class="glow" id="menuGlow" aria-hidden="true"></div>
            <div class="field">
                <label for="algoSelect">Algorithm</label>
                <select id="algoSelect">
                    <option value="1">BFS</option>
                    <option value="2">DFS</option>
                    <option value="3">Iterative DFS</option>
                    <option value="4">A* (Manhattan)</option>
                    <option value="5">A* (Euclidean)</option>
                </select>
            </div>

            <div class="field wide">
                <label for="boardInput">Initial state (9 numbers, 0 is the blank)</label>
                <input type="text" id="boardInput" value="7 2 4 5 0 6 8 3 1" inputmode="numeric" autocomplete="off"
                    spellcheck="false">
            </div>

            <div class="field">
                <label for="speed">Playback speed</label>
                <input type="range" id="speed" min="1" max="5" value="3">
            </div>

            <div class="actions">
                <button id="playBtn" type="button">Solve it!</button>
                <button id="stopBtn" type="button" hidden title="Stop (Esc)">&#9632; Stop</button>
            </div>
        </section>

        <p class="status" id="status" role="status" aria-live="polite">Patrick is ready. Pick an algorithm and press
            solve.</p>

        <section class="solver-stats" aria-label="Solver statistics" aria-live="polite">
            <div class="stat-card"><span class="stat-label">Nodes expanded</span><span class="stat-value" id="nodesExpanded">—</span></div>
            <div class="stat-card"><span class="stat-label">Search depth</span><span class="stat-value" id="searchDepth">—</span></div>
            <div class="stat-card"><span class="stat-label">Running time</span><span class="stat-value" id="runningTime">—</span></div>
        </section>
        <div class="trace-tools">
            <button id="traceBtn" type="button" aria-expanded="false" aria-controls="tracePanel" disabled>☷ View solution trace</button>
        </div>
        <section class="trace-panel" id="tracePanel" hidden aria-label="Solution board trace">
            <div class="trace-heading"><h2>Board-by-board trace</h2><span id="traceCount">No solution loaded</span></div>
            <p class="trace-note">Every card is one board state. Follow the arrows by reading the move between consecutive states.</p>
            <div class="trace-step-actions">
                <button type="button" id="tracePrev" disabled>← Previous page</button>
                <button type="button" id="traceShowCurrent">Show this board</button>
                <button type="button" id="traceNext" disabled>Next page →</button>
            </div>
            <div class="trace-list" id="traceList"></div>
        </section>

        <section class="stage">
            <div class="board-wrap">
                <div class="board" id="board" aria-label="Puzzle board"></div>
            </div>

            <div class="patrick-wrap" id="patrickWrap" data-state="idle">
                <div class="patrick-frame">
                    <img id="imgIdle" alt="Patrick standing and smiling" class="show">
                    <img id="imgBusy" alt="Patrick drooling while he thinks">
                    <img id="imgHappy" alt="Patrick celebrating with his arms up">
                </div>
                <div class="bubble-speech" id="speech">Hmmmm…</div>
            </div>
        </section>
    </main>

    <script src="app.js" defer></script>
</body>

</html>
