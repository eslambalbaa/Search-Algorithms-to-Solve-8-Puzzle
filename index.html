<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patrick's 8-Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
    :root {
        --deep: #0a3552;
        --water: #1b86b5;
        --shallow: #5cc8e0;
        --sand: #f3dca2;
        --sand-dark: #d9b873;
        --pink: #f5a29b;
        --pink-dark: #e06f6a;
        --green: #b6e24b;
        --purple: #8b5fc6;
        --ink: #3b1f3f;
        --foam-top: #f3fcfe;
        --foam-bot: #c9edf6;
        --energy: 0;            /* 0 = calm, 1 = solving (driven by the vortex engine) */

        --tile: 104px;
        --gap: 10px;
        --move-ms: 400ms;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
        font-family: 'Nunito', system-ui, sans-serif;
        font-weight: 600;
        color: #fff;
        background:
            radial-gradient(ellipse at 50% 38%, rgba(255,255,255,.9), transparent 62%),
            linear-gradient(180deg, var(--foam-top) 0%, #dff4fa 55%, var(--foam-bot) 100%);
        background-attachment: fixed;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 28px 16px 140px;
        overflow-x: hidden;
        position: relative;
    }

    /* sandy sea floor */
    body::after {
        content: "";
        position: fixed;
        left: 0; right: 0; bottom: 0;
        height: 90px;
        background:
            radial-gradient(circle at 12% 0, var(--sand) 0 38px, transparent 39px),
            radial-gradient(circle at 38% 0, var(--sand) 0 46px, transparent 47px),
            radial-gradient(circle at 66% 0, var(--sand) 0 40px, transparent 41px),
            radial-gradient(circle at 90% 0, var(--sand) 0 48px, transparent 49px),
            linear-gradient(var(--sand), var(--sand-dark));
        z-index: 0;
        pointer-events: none;
    }

    .bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .bubble {
        position: absolute;
        bottom: -40px;
        border-radius: 50%;
        border: 2px solid rgba(27,134,181,.38);
        border: 2px solid color-mix(in srgb, #fff calc(var(--energy) * 100%), rgba(27,134,181,.38));
        background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.95), rgba(92,200,224,.12) 62%);
        animation: rise linear infinite;
    }
    @keyframes rise {
        from { transform: translateY(0) translateX(0); opacity: 0; }
        10%  { opacity: 1; }
        50%  { transform: translateY(-55vh) translateX(18px); }
        to   { transform: translateY(-115vh) translateX(-10px); opacity: 0; }
    }

    main { position: relative; z-index: 1; width: 100%; max-width: 840px; display: flex; flex-direction: column; align-items: center; }

    h1 {
        font-family: 'Lilita One', system-ui, sans-serif;
        font-weight: 400;
        font-size: clamp(2.2rem, 6vw, 3.6rem);
        letter-spacing: .02em;
        margin: 4px 0 22px;
        color: var(--pink);
        -webkit-text-stroke: 2px var(--ink);
        paint-order: stroke fill;
        text-shadow: 0 4px 0 var(--ink), 0 8px 18px rgba(0,0,0,.25);
        transform: rotate(-1.5deg);
        text-align: center;
    }

    /* controls */
    .controls {
        width: 100%;
        background: linear-gradient(180deg, #0f4a73, var(--deep));
        border: 3px solid var(--ink);
        border-radius: 22px;
        padding: 16px 18px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 14px 18px;
        align-items: end;
        box-shadow: 0 8px 0 var(--ink),
                    0 0 calc(var(--energy) * 46px) rgba(92,200,224, calc(var(--energy) * .75));
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.wide { grid-column: span 2; }
    .field label { font-size: .9rem; font-weight: 800; color: var(--shallow); }

    select, input[type="text"] {
        font: inherit;
        font-weight: 800;
        color: var(--ink);
        background: #fff7e2;
        border: 3px solid var(--ink);
        border-radius: 12px;
        padding: 9px 12px;
        width: 100%;
    }
    input[type="text"].invalid { border-color: #ff5d5d; background: #ffe5e5; }
    input[type="range"] { accent-color: var(--pink-dark); width: 100%; height: 40px; }

    #playBtn {
        font-family: 'Lilita One', system-ui, sans-serif;
        font-size: 1.35rem;
        letter-spacing: .03em;
        color: var(--ink);
        background: var(--green);
        border: 3px solid var(--ink);
        border-radius: 14px;
        padding: 9px 22px;
        cursor: pointer;
        box-shadow: 0 5px 0 var(--ink);
        transition: transform .08s, box-shadow .08s, background .2s;
    }
    #playBtn:hover:not(:disabled) { background: #c9f05f; transform: translateY(-2px); box-shadow: 0 7px 0 var(--ink); }
    #playBtn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
    #playBtn:disabled { background: #9fb3a0; cursor: progress; box-shadow: 0 2px 0 var(--ink); transform: translateY(3px); }
    :focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    .status {
        margin: 18px 0 0;
        min-height: 1.5em;
        font-weight: 800;
        text-align: center;
        color: var(--ink);
        background: #fff7e2;
        border: 3px solid var(--ink);
        border-radius: 999px;
        padding: 6px 20px;
        box-shadow: 0 4px 0 var(--ink);
    }
    .status.error { background: #ffe5e5; color: #a02828; }

    /* stage */
    .stage {
        margin-top: 26px;
        display: flex;
        gap: 44px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
    }

    .board-wrap { position: relative; }
    .board {
        position: relative;
        width: calc(var(--tile) * 3 + var(--gap) * 4);
        height: calc(var(--tile) * 3 + var(--gap) * 4);
        padding: var(--gap);
        background: var(--sand-dark);
        border: 4px solid var(--ink);
        border-radius: 26px;
        box-shadow: 0 10px 0 var(--ink), 0 24px 30px rgba(0,0,0,.3);
        background-image:
            radial-gradient(rgba(255,255,255,.22) 2px, transparent 3px),
            radial-gradient(rgba(0,0,0,.08) 2px, transparent 3px);
        background-size: 22px 22px, 31px 31px;
        background-position: 0 0, 9px 11px;
    }
    .slot {
        position: absolute;
        width: var(--tile); height: var(--tile);
        border-radius: 18px;
        background: rgba(0,0,0,.14);
        box-shadow: inset 0 4px 10px rgba(0,0,0,.28);
    }
    .tile {
        position: absolute;
        top: var(--gap); left: var(--gap);
        width: var(--tile); height: var(--tile);
        border-radius: 18px;
        display: grid;
        place-items: center;
        font-family: 'Lilita One', system-ui, sans-serif;
        font-size: 3rem;
        color: #fff;
        -webkit-text-stroke: 2px var(--ink);
        paint-order: stroke fill;
        background:
            radial-gradient(circle at 24% 22%, rgba(255,255,255,.45), transparent 42%),
            radial-gradient(circle at 78% 82%, var(--pink-dark) 0 6px, transparent 7px),
            radial-gradient(circle at 18% 78%, var(--pink-dark) 0 4px, transparent 5px),
            radial-gradient(circle at 84% 20%, var(--pink-dark) 0 3px, transparent 4px),
            var(--pink);
        border: 3px solid var(--ink);
        box-shadow: 0 5px 0 var(--ink);
        transition: transform var(--move-ms) cubic-bezier(.34, 1.45, .5, 1);
        will-change: transform;
        user-select: none;
    }
    .tile.moved { animation: squish var(--move-ms) ease-out; }
    @keyframes squish {
        0%   { filter: brightness(1.15); }
        100% { filter: brightness(1); }
    }
    .tile.done {
        background:
            radial-gradient(circle at 24% 22%, rgba(255,255,255,.45), transparent 42%),
            var(--green);
        animation: hop .6s ease-out var(--d, 0s);
    }
    @keyframes hop {
        0%, 100% { translate: 0 0; }
        40% { translate: 0 -16px; }
    }

    /* Patrick */
    .patrick-wrap { position: relative; width: 300px; height: 340px; display: grid; place-items: center; }
    .patrick-frame {
        position: relative;
        width: 280px; height: 320px;
        border-radius: 32px;
        border: 4px solid var(--ink);
        background: #fff;
        overflow: hidden;
        box-shadow: 0 10px 0 var(--ink), 0 24px 30px rgba(0,0,0,.3);
        transform: rotate(2deg);
        transition: transform .4s cubic-bezier(.34, 1.56, .64, 1);
    }
    /* once you swap to transparent PNGs, set TRANSPARENT_IMAGES = true in the script */
    .patrick-wrap.transparent .patrick-frame {
        background: none; border: 0; box-shadow: none; overflow: visible;
    }
    .patrick-wrap.transparent .patrick-frame img { filter: drop-shadow(0 10px 0 rgba(59,31,63,.35)); }

    .patrick-frame img {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover;
        opacity: 0;
        transform: scale(.9);
        transition: opacity .25s ease, transform .45s cubic-bezier(.34, 1.56, .64, 1);
        pointer-events: none;
    }
    .patrick-wrap.transparent .patrick-frame img { object-fit: contain; }
    .patrick-frame img.show { opacity: 1; transform: scale(1); }

    .patrick-wrap[data-state="idle"] .patrick-frame { animation: bob 3.2s ease-in-out infinite; }
    .patrick-wrap[data-state="busy"] .patrick-frame { animation: wiggle .5s ease-in-out infinite; }
    .patrick-wrap[data-state="happy"] .patrick-frame { animation: celebrate .8s cubic-bezier(.3, 1.6, .5, 1) 3; }

    @keyframes bob {
        0%, 100% { transform: rotate(2deg) translateY(0); }
        50%      { transform: rotate(-1deg) translateY(-8px); }
    }
    @keyframes wiggle {
        0%, 100% { transform: rotate(-3deg) translateY(0); }
        50%      { transform: rotate(4deg) translateY(-4px); }
    }
    @keyframes celebrate {
        0%   { transform: rotate(2deg) scale(1); }
        40%  { transform: rotate(-4deg) scale(1.08) translateY(-18px); }
        100% { transform: rotate(2deg) scale(1); }
    }

    .bubble-speech {
        position: absolute;
        top: -6px; right: -14px;
        background: #fff;
        color: var(--ink);
        font-family: 'Lilita One', system-ui, sans-serif;
        font-size: 1.05rem;
        padding: 8px 14px;
        border: 3px solid var(--ink);
        border-radius: 18px;
        box-shadow: 0 4px 0 var(--ink);
        transform: rotate(5deg) scale(0);
        transform-origin: bottom left;
        transition: transform .35s cubic-bezier(.34, 1.56, .64, 1);
        z-index: 3;
        white-space: nowrap;
    }
    .bubble-speech.show { transform: rotate(5deg) scale(1); }

    /* deep-ocean tint: fades in while solving, fades out when done */
    .tint {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        opacity: calc(var(--energy) * .92);
        background:
            radial-gradient(ellipse at 50% 30%, rgba(255,255,255,.28), transparent 55%),
            linear-gradient(180deg, var(--shallow) 0%, var(--water) 40%, var(--deep) 100%);
    }
    #vortex { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

    #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

    @media (max-width: 1000px) { #vortex { opacity: .55; } }
    @media (max-width: 720px) {
        #vortex { opacity: .4; }
        :root { --tile: 88px; --gap: 8px; }
        .field.wide { grid-column: span 1; }
        .tile { font-size: 2.4rem; }
    }
    @media (prefers-reduced-motion: reduce) {
        .bubble, .patrick-frame, .tile { animation: none !important; }
        .tile { transition-duration: 1ms; }
    }
</style>
</head>
<body>
    <div class="tint" aria-hidden="true"></div>
    <canvas id="vortex" aria-hidden="true"></canvas>
    <div class="bubbles" id="bubbles" aria-hidden="true"></div>
    <canvas id="confetti" aria-hidden="true"></canvas>

    <main>
        <h1>Patrick's 8-Puzzle</h1>

        <section class="controls" aria-label="Puzzle settings">
            <div class="field">
                <label for="algoSelect">Algorithm</label>
                <select id="algoSelect">
                    <option value="1">BFS</option>
                    <option value="2">DFS</option>
                    <option value="3">Iterative DFS</option>
                    <option value="4">A* (Manhattan)</option>
                    <option value="5">A* (Euclidean)</option>
                </select>
            </div>

            <div class="field wide">
                <label for="boardInput">Initial state (9 numbers, 0 is the blank)</label>
                <input type="text" id="boardInput" value="7 2 4 5 0 6 8 3 1" inputmode="numeric" autocomplete="off" spellcheck="false">
            </div>

            <div class="field">
                <label for="speed">Playback speed</label>
                <input type="range" id="speed" min="1" max="5" value="3">
            </div>

            <button id="playBtn" type="button">Solve it!</button>
        </section>

        <p class="status" id="status" role="status" aria-live="polite">Patrick is ready. Pick an algorithm and press solve.</p>

        <section class="stage">
            <div class="board-wrap">
                <div class="board" id="board" aria-label="Puzzle board"></div>
            </div>

            <div class="patrick-wrap" id="patrickWrap" data-state="idle">
                <div class="patrick-frame">
                    <img id="imgIdle"  alt="Patrick standing and smiling" class="show">
                    <img id="imgBusy"  alt="Patrick drooling while he thinks">
                    <img id="imgHappy" alt="Patrick celebrating with his arms up">
                </div>
                <div class="bubble-speech" id="speech">Hmmmm…</div>
            </div>
        </section>
    </main>

<script>
/* ---------- config ---------- */
const IMAGES = {
    idle:  'assets/idle.jfif',        // swap for transparent PNG/WebP when you have them
    busy:  'assets/animating.jfif',
    happy: 'assets/happy.jfif'
};
const TRANSPARENT_IMAGES = false;   // true = no frame/background behind Patrick
const SPEEDS_MS = { 1: 900, 2: 650, 3: 450, 4: 280, 5: 150 };  // time per move

/* ---------- elements ---------- */
const $ = id => document.getElementById(id);
const boardEl = $('board'), playBtn = $('playBtn'), boardInput = $('boardInput');
const algoSelect = $('algoSelect'), speedEl = $('speed'), statusEl = $('status');
const wrap = $('patrickWrap'), speech = $('speech');
const pics = { idle: $('imgIdle'), busy: $('imgBusy'), happy: $('imgHappy') };

for (const k in pics) pics[k].src = IMAGES[k];
wrap.classList.toggle('transparent', TRANSPARENT_IMAGES);

/* ---------- ambient bubbles ---------- */
(function makeBubbles() {
    const host = $('bubbles');
    for (let i = 0; i < 16; i++) {
        const b = document.createElement('span');
        const s = 8 + Math.random() * 30;
        b.className = 'bubble';
        b.style.cssText = `width:${s}px;height:${s}px;left:${Math.random() * 100}%;` +
            `animation-duration:${9 + Math.random() * 12}s;animation-delay:${-Math.random() * 18}s`;
        host.appendChild(b);
    }
})();

/* ---------- twin vortices ---------- */
const Vortices = (() => {
    const cv = $('vortex'), g = cv.getContext('2d');
    const root = document.documentElement;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const TAU = Math.PI * 2, SEG = 72, NB = 6, NE = 9;          // segments per strand, depth buckets, energy levels
    const IDLE = reduce ? 0.06 : 0.32;                          // rad/s, calm
    const BUSY = reduce ? 0.5 : 4.6;                            // rad/s, while Patrick is solving

    /* palette: cyan outer flow, blue shell, sand-orange + Patrick-pink core */
    const COLORS = [];
    const addColors = (list, lift) => { const first = COLORS.length; list.forEach(rgb => COLORS.push({ rgb, lift })); return first; };
    const C_CORE = addColors([[240,160,75],[247,201,139],[245,162,155],[224,111,106],[240,160,75]], .10);
    const C_MID  = addColors([[47,111,214],[58,130,224],[91,127,208],[37,87,184],[122,142,224]], .42);
    const C_OUT  = addColors([[63,199,221],[92,200,224],[53,180,212],[122,214,232],[59,179,184]], .35);

    /* opaque strokes (no alpha) so round joints never bead; far side blends into the background instead */
    const BG_CALM = [222, 244, 250], BG_BUSY = [30, 140, 185];
    const styles = COLORS.map(c => {
        const byE = [];
        for (let e = 0; e < NE; e++) {
            const k = e / (NE - 1), lift = k * c.lift;
            const bg = BG_CALM.map((v, i) => v + (BG_BUSY[i] - v) * .92 * k);
            const row = [];
            for (let b = 0; b < NB; b++) {
                const f = b / (NB - 1), shade = .78 + .22 * f, hi = f > .8 ? .10 : 0, far = .55 * (1 - f);
                const ch = i => {
                    let v = c.rgb[i] * shade;
                    v += (255 - v) * (lift + hi);
                    v += (bg[i] - v) * far;
                    return Math.round(Math.max(0, Math.min(255, v)));
                };
                row.push(`rgb(${ch(0)},${ch(1)},${ch(2)})`);
            }
            byE.push(row);
        }
        return byE;
    });

    /* ---- geometry: every strand is a curve (radius, angle, height) sampled at SEG+1 points ---- */
    function rng(seed) { let s = seed >>> 0; return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296; }
    const lerp = (a, b, t) => a + (b - a) * t;
    const taper = (t, peak) => { const p = Math.pow(t, peak); return Math.pow(4 * p * (1 - p), .7); };

    function build(seed, q) {
        const r = rng(seed), S = [];
        const pick = (first, n) => first + ((r() * n) | 0);
        const mk = (ci, base, peak, fn) => {
            const n = SEG + 1;
            const st = { ci, R: new Float32Array(n), CA: new Float32Array(n), SA: new Float32Array(n), Y: new Float32Array(n), W: new Float32Array(n) };
            for (let k = 0; k < n; k++) {
                const t = k / SEG, [rr, aa, yy] = fn(t);
                st.R[k] = rr; st.CA[k] = Math.cos(aa); st.SA[k] = Math.sin(aa); st.Y[k] = yy;
                st.W[k] = base * taper(t, peak);
            }
            S.push(st);
        };

        /* core: tight sand-orange / pink helices running the full height, flaring at the ends (axial stretching) */
        for (let i = 0, n = Math.round(18 * q); i < n; i++) {
            const rb = .09 + r() * .17, turns = 4 + r() * 2.2, th0 = r() * TAU, ph = r() * TAU;
            const y0 = -(.82 + r() * .15), y1 = .8 + r() * .18;
            mk(pick(C_CORE, 5), .016 + r() * .007, 1, t => {
                const y = lerp(y0, y1, t);
                return [rb * (1 + .9 * Math.pow(Math.abs(y), 2.2)) + .015 * Math.sin(t * 11 + ph), th0 + TAU * turns * t, y];
            });
        }
        /* shell: wide blue ribbons winding up and down around the core */
        for (let i = 0, n = Math.round(22 * q); i < n; i++) {
            const r0 = .5 + r() * .6, rEnd = .2 + r() * .2, up = r() < .5 ? 1 : -1;
            const yMax = .55 + r() * .42, turns = 2 + r() * 1.7, th0 = r() * TAU, y00 = (r() - .5) * .12;
            mk(pick(C_MID, 5), .034 + r() * .02, 1, t =>
                [rEnd + (r0 - rEnd) * Math.pow(1 - t, 1.5), th0 + TAU * turns * Math.pow(t, 1.3), y00 + up * yMax * Math.pow(t, 1.2)]);
        }
        /* outer: cyan streamlines that sweep in from far away and spiral inward (inward spiral) */
        for (let i = 0, n = Math.round(26 * q); i < n; i++) {
            const r0 = 1.1 + r() * 1.3, rEnd = .35 + r() * .25, up = r() < .5 ? 1 : -1;
            const yMax = .18 + Math.pow(r(), 1.2) * .8, turns = .9 + r() * 1.5, th0 = r() * TAU, y00 = (r() - .5) * .1;
            mk(pick(C_OUT, 5), .030 + r() * .024, .72, t =>
                [rEnd + (r0 - rEnd) * Math.pow(1 - t, 2.1), th0 + TAU * turns * Math.pow(t, 1.35), y00 + up * yMax * Math.pow(t, 1.7)]);
        }
        return S;
    }

    /* ---- one vortex = strands + scratch buffers + a few particles riding the streamlines ---- */
    function makeVortex(seed, mirror, q) {
        const strands = build(seed, q), n1 = SEG + 1, N = strands.length;
        const r = rng(seed ^ 0x9e3779b9);
        const flowable = strands.map((s, i) => i).filter(i => strands[i].ci >= C_MID);
        const parts = Array.from({ length: Math.round(22 * q) }, () => ({ s: flowable[(r() * flowable.length) | 0], u: r(), v: .05 + r() * .05, b: 0, x: 0, y: 0, z: 1 }));
        const segStrand = new Uint16Array(N * SEG), segK = new Uint8Array(N * SEG);
        for (let i = 0; i < N; i++) for (let k = 0; k < SEG; k++) { segStrand[i * SEG + k] = i; segK[i * SEG + k] = k; }
        return {
            strands, N, mirror, parts, segStrand, segK, rot: r() * TAU,
            px: new Float32Array(N * n1), py: new Float32Array(N * n1), pd: new Float32Array(N * n1),
            sb: new Uint8Array(N * SEG), order: new Int32Array(N * SEG)
        };
    }

    const lowPower = (navigator.hardwareConcurrency || 8) <= 4;
    let W = 0, H = 0, dpr = 1, U = 100, halfH = 300, axis = 150, quality = 1, L, R;

    function layout() {
        W = innerWidth; H = innerHeight;
        dpr = Math.min(devicePixelRatio || 1, 1.75);
        cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        U = Math.max(70, Math.min(W * .115, H * .2));
        halfH = H * .43;
        axis = Math.max(U * .95, W * .12);
        const q = (W < 700 || lowPower) ? .6 : 1;
        if (q !== quality || !L) { quality = q; L = makeVortex(7, 1, q); R = makeVortex(31, -1, q); }
    }
    let resizeT = 0;
    addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(layout, 120); });
    layout();

    /* ---- state: spin is a critically-damped spring, so it ramps up and coasts down smoothly ---- */
    let omega = IDLE, omegaV = 0, target = IDLE, time = 0, last = 0;
    let pulse = 0, pulseV = 0, flash = 0;
    const ripples = [];
    let lastE = -1, lastLevel = -1, bubbleAnims = null;

    function project(v, cx, Ru, cosT, sinT, cr, sr) {
        const { strands, px, py, pd, sb, order, N, mirror } = v, n1 = SEG + 1, dn = 1 / (Ru * 1.25);
        for (let i = 0; i < N; i++) {
            const s = strands[i], base = i * n1;
            for (let k = 0; k < n1; k++) {
                const ca = s.CA[k] * cr - s.SA[k] * sr, sa = s.SA[k] * cr + s.CA[k] * sr;
                const rp = s.R[k] * Ru, Yp = s.Y[k] * halfH, Z = rp * sa;
                const j = base + k;
                px[j] = cx + rp * ca * mirror;
                py[j] = H * .5 - (Yp * cosT - Z * sinT);
                pd[j] = (Z * cosT + Yp * sinT) * dn;
            }
        }
        const counts = [0, 0, 0, 0, 0, 0, 0];
        for (let i = 0; i < N; i++) {
            const base = i * n1;
            for (let k = 0; k < SEG; k++) {
                const d = (pd[base + k] + pd[base + k + 1]) * .5;
                const b = Math.max(0, Math.min(NB - 1, Math.floor((d * .5 + .5) * NB)));
                sb[i * SEG + k] = b; counts[b + 1]++;
            }
        }
        for (let b = 0; b < NB; b++) counts[b + 1] += counts[b];
        for (let id = 0, tot = N * SEG; id < tot; id++) order[counts[sb[id]]++] = id;
        return counts;                       // after the fill, counts[b] = end index of bucket b
    }

    function drawVortex(v, cx, Ru, cosT, sinT, eL, e) {
        const counts = project(v, cx, Ru, cosT, sinT, Math.cos(v.rot), Math.sin(v.rot));
        const { strands, px, py, order, segStrand, segK, parts } = v, n1 = SEG + 1;
        const widen = U * (1 + .12 * e) * (Ru / U);

        /* particles: bucket them by depth so they sit correctly between the strands */
        for (const p of parts) {
            const s = strands[p.s], f = Math.min(SEG - 1e-3, p.u * SEG), k = f | 0, a = f - k, j = p.s * n1 + k;
            p.x = px[j] + (px[j + 1] - px[j]) * a; p.y = py[j] + (py[j + 1] - py[j]) * a;
            const d = v.pd[j] + (v.pd[j + 1] - v.pd[j]) * a;
            p.b = Math.max(0, Math.min(NB - 1, Math.floor((d * .5 + .5) * NB)));
            p.z = .55 + .45 * (p.b / (NB - 1));
        }

        g.lineCap = 'round'; g.lineJoin = 'round';
        let from = 0;
        for (let b = 0; b < NB; b++) {
            const to = counts[b], f = b / (NB - 1), ws = (.7 + .45 * f) * widen;
            /* consecutive segments of one strand at the same (0.5px-quantised) width share one path */
            let open = false, prev = -2, curW = 0, lastStyle = '';
            for (let j = from; j < to; j++) {
                const id = order[j], si = segStrand[id], k = segK[id], s = strands[si], base = si * n1 + k;
                const qw = Math.max(.5, Math.round((s.W[k] + s.W[k + 1]) * ws) / 2 * 1);
                if (open && id === prev + 1 && k > 0 && qw === curW) {
                    g.lineTo(px[base + 1], py[base + 1]);
                } else {
                    if (open) g.stroke();
                    const st = styles[s.ci][eL][b];
                    if (st !== lastStyle) { g.strokeStyle = st; lastStyle = st; }
                    g.lineWidth = qw; curW = qw;
                    g.beginPath(); g.moveTo(px[base], py[base]); g.lineTo(px[base + 1], py[base + 1]); open = true;
                }
                prev = id;
            }
            if (open) g.stroke();
            from = to;
            g.fillStyle = '#fff'; g.strokeStyle = 'rgba(27,134,181,.6)'; g.lineWidth = 1;
            for (const p of parts) if (p.b === b) {
                g.beginPath(); g.arc(p.x, p.y, (1.3 + 1.6 * p.z) * (Ru / U), 0, TAU); g.fill(); g.stroke();
            }
        }
    }

    function drawUnder(cx, Ru, sinT, e) {
        /* soft halo that brightens with energy (and flashes on finish) */
        const a = .10 + .30 * e + .28 * flash, rad = Ru * 3.3, cy = H * .5;
        const gr = g.createRadialGradient(cx, cy, 0, cx, cy, rad);
        gr.addColorStop(0, `rgba(160,235,248,${a.toFixed(3)})`);
        gr.addColorStop(1, 'rgba(160,235,248,0)');
        g.fillStyle = gr; g.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
        /* finish ripples: rings expanding across the vortex's waist plane */
        for (const rp of ripples) {
            if (rp.age < 0) continue;
            const p = rp.age / 1.7, ease = 1 - Math.pow(1 - p, 3), rx = Ru * (.3 + 2.7 * ease);
            g.beginPath(); g.ellipse(cx, cy, rx, rx * sinT, 0, 0, TAU);
            g.strokeStyle = `rgba(255,255,255,${(.85 * (1 - p)).toFixed(3)})`; g.lineWidth = 5 * (1 - p) + 1.5; g.stroke();
            g.beginPath(); g.ellipse(cx, cy, rx * .94, rx * .94 * sinT, 0, 0, TAU);
            g.strokeStyle = `rgba(27,134,181,${(.55 * (1 - p)).toFixed(3)})`; g.lineWidth = 2 * (1 - p) + .8; g.stroke();
        }
    }

    function frame(ts) {
        requestAnimationFrame(frame);
        const dt = Math.min(.05, last ? (ts - last) / 1000 : .016); last = ts; time += dt;

        const wn = target > omega ? 3.4 : 1.9;                    // quick-ish spin-up, slower coast-down
        omegaV += (wn * wn * (target - omega) - 2 * wn * omegaV) * dt;
        omega += omegaV * dt;
        const e = Math.max(0, Math.min(1, (omega - IDLE) / (BUSY - IDLE)));
        const eL = Math.round(e * (NE - 1));

        for (let i = 0; i < 2; i++) { pulseV += (-60 * pulse - 7 * pulseV) * dt / 2; pulse += pulseV * dt / 2; }
        flash *= Math.exp(-dt / .55);
        for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].age += dt; if (ripples[i].age > 1.7) ripples.splice(i, 1); }

        L.rot += omega * dt; R.rot += omega * dt;                  // mirrored geometry, so the pair counter-rotates
        const flow = .6 + e * 2.6;
        for (const v of [L, R]) for (const p of v.parts) { p.u += p.v * flow * dt; if (p.u > 1) { p.u = 0; p.s = p.s; } }

        if (Math.abs(e - lastE) > .002) { root.style.setProperty('--energy', e.toFixed(3)); lastE = e; }
        if (eL !== lastLevel) {
            lastLevel = eL;
            if (!bubbleAnims) bubbleAnims = document.getAnimations().filter(a => a.animationName === 'rise');
            const rate = 1 + 2.2 * e;
            bubbleAnims.forEach(a => { a.playbackRate = rate; });
        }

        const tilt = .34 + (reduce ? 0 : .035 * Math.sin(time * .35));
        const cosT = Math.cos(tilt), sinT = Math.sin(tilt), Ru = U * (1 + pulse);

        g.clearRect(0, 0, W, H);
        drawUnder(axis, Ru, sinT, e);
        drawUnder(W - axis, Ru, sinT, e);
        drawVortex(L, axis, Ru, cosT, sinT, eL, e);
        drawVortex(R, W - axis, Ru, cosT, sinT, eL, e);
    }
    requestAnimationFrame(frame);

    return {
        energize() { target = BUSY; },
        calm(celebrate) {
            target = IDLE;
            if (celebrate && !reduce) { ripples.push({ age: 0 }, { age: -.22 }); pulseV = 1.1; flash = 1; }
        },
        _debug: { get omega() { return omega; } }
    };
})();
/* ---------- end vortices ---------- */

/* ---------- Patrick states ---------- */
function setPatrick(state, text) {
    wrap.dataset.state = state;
    for (const k in pics) pics[k].classList.toggle('show', k === state);
    if (text) { speech.textContent = text; speech.classList.add('show'); }
    else speech.classList.remove('show');
}

/* ---------- board (tiles slide instead of re-rendering) ---------- */
const tileEls = new Map();   // value -> element
let currentBoard = [];

function cssPx(name) { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)); }
function posFor(idx) {
    const step = cssPx('--tile') + cssPx('--gap');
    return `translate(${(idx % 3) * step}px, ${Math.floor(idx / 3) * step}px)`;
}

function buildBoard(arr) {
    boardEl.innerHTML = '';
    tileEls.clear();
    currentBoard = [...arr];
    const step = cssPx('--tile') + cssPx('--gap');
    for (let i = 0; i < 9; i++) {           // blank sand pockets
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.style.left = `${cssPx('--gap') + (i % 3) * step}px`;
        slot.style.top  = `${cssPx('--gap') + Math.floor(i / 3) * step}px`;
        boardEl.appendChild(slot);
    }
    arr.forEach((v, i) => {
        if (v === 0) return;
        const t = document.createElement('div');
        t.className = 'tile';
        t.textContent = v;
        t.style.transform = posFor(i);
        boardEl.appendChild(t);
        tileEls.set(v, t);
    });
}
function layoutBoard() { currentBoard.forEach((v, i) => v && (tileEls.get(v).style.transform = posFor(i))); }
window.addEventListener('resize', () => { buildBoard(currentBoard); });

function applyMove(move) {
    const z = currentBoard.indexOf(0);
    let t = z;
    const m = move.toLowerCase();
    if (m === 'u' || m === 'up') t -= 3;
    else if (m === 'd' || m === 'down') t += 3;
    else if (m === 'l' || m === 'left') { if (z % 3 === 0) return; t -= 1; }
    else if (m === 'r' || m === 'right') { if (z % 3 === 2) return; t += 1; }
    if (t < 0 || t > 8) return;

    const val = currentBoard[t];
    currentBoard[z] = val;
    currentBoard[t] = 0;
    const el = tileEls.get(val);
    el.style.transform = posFor(z);
    el.classList.remove('moved'); void el.offsetWidth; el.classList.add('moved');
}

/* ---------- input ---------- */
function parseBoard(str) {
    const nums = str.trim().split(/[\s,]+/).map(Number);
    if (nums.length !== 9 || nums.some(n => !Number.isInteger(n))) return null;
    if ([...nums].sort((a, b) => a - b).join() !== '0,1,2,3,4,5,6,7,8') return null;
    return nums;
}
function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.classList.toggle('error', isError);
}

boardInput.addEventListener('input', () => {
    const b = parseBoard(boardInput.value);
    boardInput.classList.toggle('invalid', !b);
    if (b && !playBtn.disabled) { buildBoard(b); setPatrick('idle'); setStatus('Patrick is ready. Pick an algorithm and press solve.'); }
});

speedEl.addEventListener('input', () =>
    document.documentElement.style.setProperty('--move-ms', SPEEDS_MS[speedEl.value] + 'ms'));
document.documentElement.style.setProperty('--move-ms', SPEEDS_MS[speedEl.value] + 'ms');

/* ---------- run ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));

playBtn.addEventListener('click', async () => {
    const start = parseBoard(boardInput.value);
    if (!start) {
        boardInput.classList.add('invalid');
        setStatus('Enter each number from 0 to 8 exactly once, separated by spaces.', true);
        return;
    }

    playBtn.disabled = true;
    Vortices.energize();
    let solved = false;
    stopConfetti();
    buildBoard(start);
    setPatrick('busy', 'Hmmmm…');
    setStatus('Patrick is thinking…');

    try {
        const response = await fetch('/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ algo: algoSelect.value, board: boardInput.value.trim() })
        });
        if (!response.ok) throw new Error('Execution failed');
        const data = await response.json();

        if (!data.path || data.path.length === 0) {
            setPatrick('idle');
            setStatus('Nothing to solve: no solution found, or the board is already solved.');
            return;
        }

        buildBoard(data.initial_board);
        await sleep(350);
        setStatus(`Solving in ${data.path.length} moves…`);

        for (let i = 0; i < data.path.length; i++) {
            applyMove(data.path[i]);
            setStatus(`Move ${i + 1} of ${data.path.length}`);
            await sleep(SPEEDS_MS[speedEl.value] + 90);
        }

        await sleep(250);
        solved = true;
        celebrate(data.path.length);
    } catch (err) {
        console.error(err);
        setPatrick('idle');
        setStatus('Could not reach the solver. Check that server.py is running and output/main.exe exists.', true);
    } finally {
        playBtn.disabled = false;
        Vortices.calm(solved);
    }
});

function celebrate(moves) {
    setPatrick('happy', 'I did it!');
    setStatus(`Solved in ${moves} moves.`);
    [...tileEls.values()].forEach((t, i) => { t.style.setProperty('--d', i * 0.06 + 's'); t.classList.add('done'); });
    startConfetti();
    setTimeout(() => {
        tileEls.forEach(t => t.classList.remove('done'));
        speech.classList.remove('show');
    }, 5000);
}

/* ---------- confetti (no library) ---------- */
const canvas = $('confetti'), ctx = canvas.getContext('2d');
const COLORS = ['#f5a29b', '#b6e24b', '#8b5fc6', '#ffe066', '#5cc8e0', '#ffffff'];
let parts = [], raf = null, spawnUntil = 0;

function fit() { canvas.width = innerWidth * devicePixelRatio; canvas.height = innerHeight * devicePixelRatio; }
addEventListener('resize', fit); fit();

function burst(x, y, dirX, n) {
    for (let i = 0; i < n; i++) {
        parts.push({
            x: x * devicePixelRatio, y: y * devicePixelRatio,
            vx: dirX * (2 + Math.random() * 10) * devicePixelRatio,
            vy: -(11 + Math.random() * 12) * devicePixelRatio,
            size: (7 + Math.random() * 8) * devicePixelRatio,
            rot: Math.random() * 6.28, vr: (Math.random() - .5) * .35,
            color: COLORS[(Math.random() * COLORS.length) | 0],
            star: Math.random() < .35, life: 0
        });
    }
}
function star(c, r) {
    c.beginPath();
    for (let i = 0; i < 10; i++) {
        const rad = i % 2 ? r * .45 : r;
        const a = (Math.PI / 5) * i - Math.PI / 2;
        c[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rad, Math.sin(a) * rad);
    }
    c.closePath(); c.fill();
}
function tick(now) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (now < spawnUntil && Math.random() < .5) {          // gentle rain after the burst
        parts.push({
            x: Math.random() * canvas.width, y: -20, vx: (Math.random() - .5) * 3, vy: 3 + Math.random() * 3,
            size: (6 + Math.random() * 7) * devicePixelRatio, rot: Math.random() * 6.28, vr: (Math.random() - .5) * .3,
            color: COLORS[(Math.random() * COLORS.length) | 0], star: Math.random() < .3, life: 0
        });
    }
    parts = parts.filter(p => p.y < canvas.height + 40 && p.life < 360);
    for (const p of parts) {
        p.vy += .32 * devicePixelRatio; p.vx *= .992;
        p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
        if (p.star) star(ctx, p.size * .8); else ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * .6);
        ctx.restore();
    }
    raf = (parts.length || now < spawnUntil) ? requestAnimationFrame(tick) : null;
}
function startConfetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    burst(innerWidth * .12, innerHeight * .85, 1, 70);
    burst(innerWidth * .88, innerHeight * .85, -1, 70);
    spawnUntil = performance.now() + 2500;
    if (!raf) raf = requestAnimationFrame(tick);
}
function stopConfetti() { parts = []; spawnUntil = 0; ctx.clearRect(0, 0, canvas.width, canvas.height); }

/* ---------- init ---------- */
buildBoard(parseBoard(boardInput.value));
setPatrick('idle');
</script>
</body>
